<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Evolução</title>

  <style>
    :root {
      --background: #10131b;
      --panel: #1c2230;
      --text: #ffffff;
      --accent: #8b5cf6;
      --secondary: #30394d;
    }

    body.light {
      --background: #eeeeF5;
      --panel: #ffffff;
      --text: #171717;
      --accent: #7044d8;
      --secondary: #ddddE8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
      transition: 0.3s;
    }

    .topo {
      text-align: center;
      padding: 30px 15px;
      background: var(--panel);
      border-bottom: 2px solid var(--accent);
    }

    .topo h1 {
      letter-spacing: 3px;
    }

    .container {
      width: 90%;
      max-width: 850px;
      margin: 30px auto;
    }

    .painel {
      background: var(--panel);
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 12px #0003;
    }

    h2 {
      color: var(--accent);
      margin-top: 0;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: none;
      border-radius: 7px;
      background: var(--secondary);
      color: var(--text);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 7px;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      opacity: 0.85;
    }

    .barra {
      width: 100%;
      height: 12px;
      background: var(--secondary);
      border-radius: 20px;
      overflow: hidden;
    }

    #xpBar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.3s;
    }

    .missao {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      margin: 10px 0;
      background: var(--secondary);
      border-radius: 8px;
    }

    .missao.concluida {
      opacity: 0.65;
      text-decoration: line-through;
    }

    .status {
      margin: 15px 0;
    }

    .status-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .status-bar {
      height: 10px;
      background: var(--secondary);
      border-radius: 20px;
      overflow: hidden;
    }

    .status-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.3s;
    }

    .danger {
      background: #dc3545;
      margin-bottom: 30px;
    }

    @media (max-width: 600px) {
      .missao {
        flex-direction: column;
        align-items: flex-start;
      }

      .container {
        width: 94%;
      }
    }

    /* SISTEMA DE PERFIL */

    .perfil {
      text-align: center;
    }

    .perfil-foto {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }

    #profilePreview {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--accent);
      background: var(--secondary);
    }

    .botao-foto {
      display: inline-block;
      padding: 10px 18px;
      background: var(--accent);
      color: white;
      border-radius: 7px;
      cursor: pointer;
      transition: 0.2s;
    }

    .botao-foto:hover {
      opacity: 0.8;
    }

    .perfil input[type="text"] {
      max-width: 350px;
    }
  </style>
</head>
<body>

  <header class="topo">
    <h1>PROJETO EVOLUÇÃO</h1>
    <p>Construa sua própria evolução.</p>
    <button id="themeButton">Alternar tema</button>
  </header>

  <main class="container">

    <section class="painel perfil">
      <h2>Meu perfil</h2>

      <div class="perfil-foto">
        <img id="profilePreview"
             src="https://placehold.co/150x150/30394d/ffffff?text=Perfil"
             alt="Foto de perfil">

        <label for="profilePhoto" class="botao-foto">
          Escolher foto
        </label>

        <input
          type="file"
          id="profilePhoto"
          accept="image/*"
          hidden
        >
      </div>

      <label for="playerName">Nickname:</label>
      <input
        id="playerName"
        type="text"
        maxlength="20"
        placeholder="Digite seu nickname"
      >

      <p>Rank: <strong id="rank">F</strong></p>
      <p>XP: <strong id="xp">0</strong></p>

      <div class="barra">
        <div id="xpBar"></div>
      </div>
    </section>

    <section class="painel">
      <h2>Status do personagem</h2>
      <div id="statusList"></div>
    </section>

    <section class="painel">
      <h2>Criar missão</h2>

      <input id="missionName" type="text"
        placeholder="Nome da missão">

      <select id="missionDifficulty">
        <option value="10">Fácil — 10 XP</option>
        <option value="25">Média — 25 XP</option>
        <option value="50">Difícil — 50 XP</option>
        <option value="100">Extrema — 100 XP</option>
      </select>

      <select id="missionStat">
        <option value="forca">Força</option>
        <option value="inteligencia">Inteligência</option>
        <option value="velocidade">Velocidade</option>
        <option value="saude">Saúde</option>
        <option value="resistencia">Resistência</option>
        <option value="sabedoria">Sabedoria</option>
        <option value="carisma">Carisma</option>
      </select>

      <button id="addMission">Adicionar missão</button>
    </section>

    <section class="painel">
      <h2>Missões diárias</h2>
      <div id="missionList"></div>
    </section>

    <section class="painel">
      <h2>Conquistas</h2>
      <div id="achievements"></div>
    </section>

    <section class="painel">
      <h2>Histórico</h2>
      <div id="history"></div>
    </section>

    <button id="resetButton" class="danger">
      Reiniciar progresso
    </button>

  </main>

  <script>
    // ==========================================
    // PROJETO EVOLUÇÃO
    // JAVASCRIPT COMPLETO
    // ==========================================

    // ATRIBUTOS DO PERSONAGEM
    const atributos = {
      forca: "Força",
      inteligencia: "Inteligência",
      velocidade: "Velocidade",
      saude: "Saúde",
      resistencia: "Resistência",
      sabedoria: "Sabedoria",
      carisma: "Carisma"
    };

    // SISTEMA DE RANKS
    const ranks = [
      { nome: "F", xp: 0 },
      { nome: "E", xp: 100 },
      { nome: "D", xp: 250 },
      { nome: "C", xp: 500 },
      { nome: "B", xp: 900 },
      { nome: "A", xp: 1500 },
      { nome: "S", xp: 2500 },
      { nome: "SS", xp: 4000 }
    ];

    // ESTADO INICIAL
    const estadoInicial = {
      nome: "",
      foto: "",
      xp: 0,

      missoes: [],

      stats: {
        forca: 0,
        inteligencia: 0,
        velocidade: 0,
        saude: 0,
        resistencia: 0,
        sabedoria: 0,
        carisma: 0
      },

      conquistas: [],
      historico: [],

      ultimaData: new Date().toLocaleDateString("pt-BR")
    };

    // CARREGAR DADOS SALVOS
    function carregarEstado() {
      try {
        const salvo = JSON.parse(
          localStorage.getItem("projetoEvolucao")
        );

        if (!salvo) {
          return structuredClone(estadoInicial);
        }

        return {
          ...structuredClone(estadoInicial),
          ...salvo,

          stats: {
            ...estadoInicial.stats,
            ...(salvo.stats || {})
          }
        };

      } catch {
        return structuredClone(estadoInicial);
      }
    }

    let estado = carregarEstado();

    // SALVAR DADOS
    function salvar() {
      localStorage.setItem(
        "projetoEvolucao",
        JSON.stringify(estado)
      );
    }

    // ==========================================
    // SISTEMA DE PERFIL
    // ==========================================

    function configurarPerfil() {

      const nomeInput = document.getElementById("playerName");
      const fotoInput = document.getElementById("profilePhoto");
      const preview = document.getElementById("profilePreview");

      // CARREGAR NICKNAME
      nomeInput.value = estado.nome || "";

      // CARREGAR FOTO
      if (estado.foto) {
        preview.src = estado.foto;
      }

      // SALVAR NICKNAME
      nomeInput.addEventListener("input", () => {

        estado.nome = nomeInput.value;

        salvar();

      });

      // SELECIONAR FOTO
      fotoInput.addEventListener("change", () => {

        const arquivo = fotoInput.files[0];

        if (!arquivo) return;

        // VERIFICAR SE É UMA IMAGEM
        if (!arquivo.type.startsWith("image/")) {

          alert("Selecione um arquivo de imagem válido.");

          fotoInput.value = "";

          return;
        }

        // LIMITE DE 2 MB
        if (arquivo.size > 2 * 1024 * 1024) {

          alert("A imagem deve ter no máximo 2 MB.");

          fotoInput.value = "";

          return;
        }

        const leitor = new FileReader();

        leitor.onload = () => {

          estado.foto = leitor.result;

          preview.src = leitor.result;

          salvar();

        };

        leitor.readAsDataURL(arquivo);

      });

    }

    // ==========================================
    // SISTEMA DE RANK
    // ==========================================

    function atualizarRank() {

      let rankAtual = ranks[0];

      for (const rank of ranks) {

        if (estado.xp >= rank.xp) {

          rankAtual = rank;

        }

      }

      document.getElementById("rank").textContent =
        rankAtual.nome;

      document.getElementById("xp").textContent =
        estado.xp;

      const proximo = ranks.find(
        rank => rank.xp > estado.xp
      );

      let progresso = 100;

      if (proximo) {

        progresso =
          ((estado.xp - rankAtual.xp) /
          (proximo.xp - rankAtual.xp)) * 100;

      }

      document.getElementById("xpBar").style.width =
        progresso + "%";

    }

    // ==========================================
    // STATUS DO PERSONAGEM
    // ==========================================

    function renderizarStatus() {

      const lista = document.getElementById("statusList");

      lista.innerHTML = "";

      for (const chave in atributos) {

        const pontos = estado.stats[chave] || 0;

        const elemento = document.createElement("div");

        elemento.className = "status";

        const info = document.createElement("div");

        info.className = "status-info";

        const nome = document.createElement("span");

        nome.textContent = atributos[chave];

        const valor = document.createElement("strong");

        valor.textContent = pontos + " pontos";

        info.append(nome, valor);

        const barra = document.createElement("div");

        barra.className = "status-bar";

        const preenchimento = document.createElement("div");

        preenchimento.className = "status-fill";

        preenchimento.style.width =
          Math.min(pontos, 100) + "%";

        barra.appendChild(preenchimento);

        elemento.append(info, barra);

        lista.appendChild(elemento);

      }

    }

    // ==========================================
    // SISTEMA DE MISSÕES
    // ==========================================

    function renderizarMissoes() {

      const lista = document.getElementById("missionList");

      lista.innerHTML = "";

      estado.missoes.forEach(missao => {

        const item = document.createElement("div");

        item.className = "missao";

        if (missao.concluida) {

          item.classList.add("concluida");

        }

        const descricao = document.createElement("span");

        const atributo = atributos[missao.atributo] || "Força";

        descricao.textContent =
          `${missao.nome} — ${missao.xp} XP — ${atributo}`;

        const botoes = document.createElement("div");

        const concluir = document.createElement("button");

        concluir.textContent =
          missao.concluida ? "Desfazer" : "Concluir";

        concluir.addEventListener("click", () => {

          concluirMissao(missao.id);

        });

        const excluir = document.createElement("button");

        excluir.textContent = "Excluir";

        excluir.addEventListener("click", () => {

          excluirMissao(missao.id);

        });

        botoes.append(concluir, excluir);

        item.append(descricao, botoes);

        lista.appendChild(item);

      });

    }

    // ADICIONAR MISSÃO
    function adicionarMissao() {

      const nome = document
        .getElementById("missionName")
        .value.trim();

      const xp = Number(
        document.getElementById("missionDifficulty").value
      );

      const atributo =
        document.getElementById("missionStat").value;

      if (!nome) {

        alert("Digite o nome da missão!");

        return;

      }

      estado.missoes.push({

        id: Date.now(),

        nome,

        xp,

        atributo,

        concluida: false

      });

      document.getElementById("missionName").value = "";

      atualizarTudo();

    }

    // CONCLUIR OU DESFAZER MISSÃO
    function concluirMissao(id) {

      const missao = estado.missoes.find(
        m => m.id === id
      );

      if (!missao) return;

      const atributo = atributos[missao.atributo]
        ? missao.atributo
        : "forca";

      if (!missao.concluida) {

        missao.concluida = true;

        estado.xp += missao.xp;

        estado.stats[atributo] =
          (estado.stats[atributo] || 0) + 1;

        estado.historico.push({

          nome: missao.nome,

          data: new Date().toLocaleDateString("pt-BR")

        });

      } else {

        missao.concluida = false;

        estado.xp = Math.max(
          0,
          estado.xp - missao.xp
        );

        estado.stats[atributo] = Math.max(
          0,
          (estado.stats[atributo] || 0) - 1
        );

      }

      atualizarTudo();

    }

    // EXCLUIR MISSÃO
    function excluirMissao(id) {

      estado.missoes = estado.missoes.filter(
        m => m.id !== id
      );

      atualizarTudo();

    }

    // ==========================================
    // HISTÓRICO
    // ==========================================

    function renderizarHistorico() {

      const lista = document.getElementById("history");

      lista.innerHTML = "";

      estado.historico.slice().reverse().forEach(registro => {

        const item = document.createElement("p");

        item.textContent =
          `${registro.data} — ${registro.nome}`;

        lista.appendChild(item);

      });

    }

    // ==========================================
    // CONQUISTAS
    // ==========================================

    function renderizarConquistas() {

      const lista = document.getElementById("achievements");

      lista.innerHTML = "";

      const total = estado.historico.length;

      const conquistas = [

        { nome: "Primeiro passo", meta: 1 },

        { nome: "Em evolução", meta: 10 },

        { nome: "Persistência", meta: 25 },

        { nome: "Lenda", meta: 50 }

      ];

      conquistas.forEach(conquista => {

        const desbloqueada = total >= conquista.meta;

        const item = document.createElement("p");

        item.textContent =
          `${desbloqueada ? "🏆" : "🔒"} ${conquista.nome}`;

        lista.appendChild(item);

      });

    }

    // ==========================================
    // ATUALIZAR TODO O SITE
    // ==========================================

    function atualizarTudo() {

      document.getElementById("playerName").value =
        estado.nome || "";

      atualizarRank();

      renderizarStatus();

      renderizarMissoes();

      renderizarHistorico();

      renderizarConquistas();

      salvar();

    }

    // ==========================================
    // EVENTOS DOS BOTÕES
    // ==========================================

    document.getElementById("addMission")
      .addEventListener("click", adicionarMissao);

    document.getElementById("themeButton")
      .addEventListener("click", () => {

        document.body.classList.toggle("light");

      });

    document.getElementById("resetButton")
      .addEventListener("click", () => {

        if (confirm("Deseja realmente reiniciar todo o progresso?")) {

          estado = structuredClone(estadoInicial);

          atualizarTudo();

          const preview = document.getElementById("profilePreview");

          preview.src =
            "https://placehold.co/150x150/30394d/ffffff?text=Perfil";

        }

      });

    // ==========================================
    // INICIALIZAÇÃO
    // ==========================================

    configurarPerfil();

    atualizarTudo();
  </script>
</body>
</html>
